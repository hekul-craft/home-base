<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.business_name }}{% endblock %} · HomeBase</title>
  <meta name="referrer" content="same-origin">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">{{ settings.business_name or "HomeBase" }}</a>
    <nav>
      <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Dashboard</a>
      <a href="/vendors" {% if request.url.path.startswith("/vendors") %}class="active"{% endif %}>Vendors</a>
      <a href="/clients" {% if request.url.path.startswith("/clients") %}class="active"{% endif %}>Clients</a>
      <a href="/properties" {% if request.url.path.startswith("/properties") %}class="active"{% endif %}>Properties</a>
      <a href="/requests" {% if request.url.path.startswith("/requests") %}class="active"{% endif %}>Requests</a>
      <a href="/settings" {% if request.url.path.startswith("/settings") %}class="active"{% endif %}>Settings</a>
      <form method="post" action="/logout" class="inline"><button class="link">Sign out</button></form>
    </nav>
  </header>
  {% endif %}
  <main class="container">
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
